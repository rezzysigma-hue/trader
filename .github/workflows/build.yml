name: Build EventEdge AI APK

on:
  push:
    paths:
      - 'EventEdgeAI-project.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check that the project ZIP exists
        run: test -f EventEdgeAI-project.zip

      - name: Extract uploaded project ZIP
        run: unzip -q EventEdgeAI-project.zip -d extracted-project

      - name: Run tests
        run: gradle -p extracted-project/EventEdgeAI testDebugUnitTest

      - name: Build debug APK
        run: gradle -p extracted-project/EventEdgeAI assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eventedge-ai-debug-apk
          path: extracted-project/EventEdgeAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
